<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easynews WebApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .search-box {
            display: flex;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px 0 0 4px;
            background-color: #2c2c2c;
            color: #ffffff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-item {
            background-color: #1e1e1e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-info {
            flex: 1;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result-meta {
            font-size: 14px;
            color: #aaaaaa;
        }
        .play-btn {
            background-color: #28a745;
            border-radius: 4px;
            margin-left: 15px;
        }
        .play-btn:hover {
            background-color: #218838;
        }
        #video-container {
            display: none;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            border-radius: 4px;
            background-color: #000;
        }
        .loading {
            display: none;
            color: #aaaaaa;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Easynews WebApp</h1>
        
        <div id="video-container">
            <video id="player" controls autoplay></video>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search for movies, shows..." onkeypress="handleKeyPress(event)">
            <button onclick="search()">Search</button>
        </div>

        <div id="loading" class="loading">Searching...</div>
        <div id="results"></div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                search();
            }
        }

        async function search() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            
            loading.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loading.style.display = 'none';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p>No results found.</p>';
                    return;
                }

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    
                    const streamUrl = `/stream?url=${encodeURIComponent(item.auth_url)}&ext=${encodeURIComponent(item.ext)}`;
                    
                    div.innerHTML = `
                        <div class="result-info">
                            <div class="result-title">${item.title}</div>
                            <div class="result-meta">Size: ${item.size} | Format: ${item.ext}</div>
                        </div>
                        <button class="play-btn" onclick="playVideo('${streamUrl}')">Play</button>
                    `;
                    resultsDiv.appendChild(div);
                });
            } catch (error) {
                loading.style.display = 'none';
                resultsDiv.innerHTML = '<p>Error occurred while searching.</p>';
                console.error(error);
            }
        }

        function playVideo(url) {
            const container = document.getElementById('video-container');
            const player = document.getElementById('player');
            
            container.style.display = 'block';
            player.src = url;
            player.play();
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
